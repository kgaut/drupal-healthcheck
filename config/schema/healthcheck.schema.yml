healthcheck.settings:
  type: config_object
  label: 'Point de santé'
  mapping:
    window:
      type: integer
      label: 'Durée de vie d''un verdict, en secondes'
      constraints:
        Range:
          min: 1
          max: 3600
    files_directory:
      type: string
      label: 'Dossier du test d''écriture du plugin « files »'
    checks:
      type: sequence
      label: 'Réglages par vérification, par identifiant de plugin'
      sequence:
        type: mapping
        label: 'Réglage d''une vérification'
        mapping:
          enabled:
            type: boolean
            label: 'Active'
          critical:
            type: boolean
            label: 'Critique : un échec fait tomber le point de santé en 503'
